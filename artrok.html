<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTROK Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFC800',
                            yellowHover: '#E6B400',
                            dark: '#0A0A0A',
                            card: '#141414',
                            border: '#262626'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Identity Services (login com Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
        
        .artrok-logo {
            font-family: 'Anton', 'Impact', sans-serif;
            font-weight: 400;
            color: #FFC800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
        }

        body {
            overflow-x: hidden;
            background-color: #0A0A0A;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }

        canvas {
            touch-action: none;
        }
        @media (max-width: 1023px) {
            #canvas-container-box { order: -1; }
            #drawing-tools { overflow-x: auto; flex-wrap: nowrap; }
            #drawing-tools > * { flex-shrink: 0; }
        }
        @media (pointer: coarse) {
            #drawing-tools button { min-width: 34px; min-height: 34px; }
            #palette button { width: 26px; height: 26px; }
        }
        #game-screen:not(.is-active) { display: none !important; }
        #game-screen.is-active { display: flex; }
        @media (min-width: 1024px) { #game-screen.is-active { display: grid; } }
        /* botão sair sempre vermelho */
        .btn-leave { background:#dc2626 !important; color:#fff !important; }
        .btn-leave:hover { background:#b91c1c !important; }

        /* modo livre: mesmo tamanho do painel normal; tela cheia só quando pedida */
        #free-mode-modal { height:100dvh; }
        #free-board { aspect-ratio:700/450; flex:none; }

        /* painel de desenho em tela cheia */
        #canvas-container-box.is-fs { background:#0A0A0A; padding:10px; }
        .pseudo-fs { position:fixed !important; inset:0; z-index:70; width:100vw; height:100dvh !important; }
        #canvas-container-box.pseudo-fs { background:#0A0A0A; padding:10px; }

        /* o painel nunca pode crescer com o conteúdo (evita esticar para baixo com o tempo) */
        #game-board { contain: size; }
        /* só o desenho é branco: a área em volta não é mais um "branco falso" */
        #canvas-container-box:not(.is-fs) #game-board { background: transparent !important; border-color: transparent !important; box-shadow: none !important; overflow: visible; }
        #canvas-container-box:not(.is-fs) #paint-canvas { border-radius: 12px; box-shadow: 0 0 0 2px #262626, 0 10px 25px rgba(0,0,0,.5); }
        #canvas-container-box.is-fs #paint-canvas { border-radius: 0; box-shadow: none; }
        #game-screen > * { min-height: 0; }

        /* contador de partidas vencidas no canto do avatar */
        .win-badge { position:absolute; right:-4px; bottom:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:#FFC800; color:#000; border:1px solid #000; font:900 9px/13px ui-monospace,monospace; text-align:center; z-index:2; }
        .win-badge.win-inf { min-width:20px; height:18px; right:-6px; bottom:-6px; font-size:15px; line-height:15px; background:linear-gradient(135deg,#FFC800,#ff7a00,#FFC800); background-size:200% 200%; animation:infShine 2s linear infinite; box-shadow:0 0 8px #FFC800; }
        @keyframes infShine { 0% { background-position:0% 50%; } 100% { background-position:200% 50%; } }
    </style>
</head>
<body class="bg-brand-dark text-white font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-yellow selection:text-black">

    <!-- CABEÇALHO GLOBAL COM IDIOMA FIXO EM TODAS AS TELAS -->
    <header class="bg-brand-card border-b border-brand-border px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-lg">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="showLobby()">
            <h1 class="text-xl sm:text-4xl artrok-logo leading-none">ARTROK</h1>
        </div>

        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <button id="fs-btn" onclick="toggleFullscreenApp()" title="Tela cheia" class="flex items-center bg-zinc-900 hover:bg-zinc-800 border border-brand-border px-2.5 py-1.5 rounded-xl text-brand-yellow transition-all">
                <i data-lucide="maximize" class="w-4 h-4"></i>
            </button>
            <button id="google-login-btn" onclick="toggleGoogleLogin()" title="Google" aria-label="Google" class="flex items-center justify-center bg-[#050505] hover:bg-black border border-brand-border px-2.5 py-1.5 rounded-xl transition-all">
                <span id="google-logo" class="flex items-center justify-center flex-shrink-0"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="#3f3f46" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg></span>
                <span id="google-status-text" class="ml-1.5 text-xs font-bold text-white">Entrar</span>
            </button>

            <!-- SELETOR DE IDIOMA: PT / EN / ES -->
            <div id="lang-selector" class="max-sm:hidden flex bg-zinc-900 p-1 rounded-xl border border-brand-border text-xs font-bold">
                <button data-lang="pt" onclick="setLanguage('pt')" class="lang-btn px-2.5 py-1 rounded-lg bg-brand-yellow text-black transition-all font-bold">PT</button>
                <button data-lang="en" onclick="setLanguage('en')" class="lang-btn px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all font-bold">EN</button>
                <button data-lang="es" onclick="setLanguage('es')" class="lang-btn px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all font-bold">ES</button>
            </div>

            <!-- BOTÃO PERFIL -->
            <button onclick="toggleProfileModal()" class="flex items-center space-x-2 bg-zinc-900 hover:bg-zinc-800 border border-brand-border px-2 sm:px-3 py-1.5 rounded-xl text-sm transition-all">
                <div class="w-7 h-7 rounded-md border-2 border-brand-yellow overflow-hidden flex items-center justify-center flex-shrink-0">
                    <img id="nav-avatar" src="" class="w-full h-full object-cover">
                </div>
                <span id="nav-username" class="font-bold hidden min-[420px]:inline max-w-[64px] sm:max-w-[110px] truncate text-brand-yellow">Perfil</span>
            </button>
        </div>
    </header>

    <!-- BANNER DE AVISO -->
    <div id="alert-banner" class="hidden bg-red-600 text-white text-center py-2 px-4 font-bold text-xs shadow-md z-50 flex items-center justify-center space-x-2">
        <i data-lucide="alert-triangle" class="w-4 h-4"></i>
        <span id="alert-banner-text">Aviso!</span>
    </div>

    <!-- TELA DE TRANSIÇÃO -->
    <div id="transition-overlay" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4 text-center space-y-3">
        <h2 id="transition-title" class="text-2xl sm:text-3xl font-black text-brand-yellow">Próximo Desenho</h2>
        <p id="transition-subtitle" class="text-zinc-300 text-xs sm:text-sm font-bold"></p>
    </div>

    <!-- MODAL DE VITÓRIA -->
    <div id="winner-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4 text-center space-y-4">
        <i data-lucide="trophy" class="w-16 h-16 text-brand-yellow animate-bounce"></i>
        <h2 class="text-2xl sm:text-3xl font-black text-brand-yellow">FIM DE PARTIDA!</h2>
        <p id="winner-text" class="text-lg sm:text-xl font-bold text-white"></p>
        <button onclick="closeWinnerModal()" class="px-6 py-3 bg-brand-yellow text-black font-extrabold rounded-xl text-xs uppercase">
            Continuar
        </button>
    </div>

    <!-- LOBBY PRINCIPAL -->
    <main id="lobby-screen" class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6 block">
        
        <div class="flex border-b border-brand-border pb-2 space-x-4 overflow-x-auto">
            <button onclick="switchLobbyTab('public')" id="tab-public-btn" class="pb-2 font-black text-sm text-brand-yellow border-b-2 border-brand-yellow uppercase tracking-wider transition-all whitespace-nowrap">
                Salas Públicas
            </button>
            <button onclick="switchLobbyTab('custom')" id="tab-custom-btn" class="pb-2 font-bold text-sm text-zinc-400 hover:text-white uppercase tracking-wider transition-all whitespace-nowrap">
                Salas Personalizadas
            </button>
            <button onclick="switchLobbyTab('private')" id="tab-private-btn" class="pb-2 font-bold text-sm text-zinc-400 hover:text-white uppercase tracking-wider transition-all whitespace-nowrap">
                Salas Particulares
            </button>
        </div>

        <!-- SEÇÃO 1: SALAS PÚBLICAS -->
        <div id="section-public-rooms" class="space-y-3">
            <div id="rooms-container" class="flex flex-col space-y-3"></div>
        </div>

        <!-- SEÇÃO 2: SALAS PERSONALIZADAS -->
        <div id="section-custom-rooms" class="hidden space-y-3">
            <div class="bg-brand-card p-4 sm:p-5 rounded-xl border border-brand-border flex flex-col sm:flex-row items-center justify-between gap-3">
                <div>
                    <h3 class="font-bold text-sm sm:text-base text-white">Criar Nova Sala Personalizada</h3>
                    <p class="text-xs text-zinc-400">Requer login com o Google ativo.</p>
                </div>
                <button onclick="openCreateCustomModal()" class="w-full sm:w-auto px-5 py-2.5 bg-brand-yellow text-black font-extrabold rounded-xl text-xs uppercase transition-all shadow-md">
                    Criar Sala
                </button>
            </div>
            <div id="custom-rooms-list" class="flex flex-col space-y-3"></div>
        </div>

        <!-- SEÇÃO 3: SALAS PARTICULARES -->
        <div id="section-private-rooms" class="hidden space-y-4">
            <div class="bg-brand-card p-4 sm:p-5 rounded-xl border border-brand-border flex flex-col sm:flex-row items-center justify-between gap-4">
                <button onclick="createPrivateRoom()" class="w-full sm:w-auto px-6 py-3 bg-brand-yellow text-black font-extrabold rounded-xl text-xs uppercase transition-all shadow-md">
                    Criar Sala Particular
                </button>
            </div>

            <div class="bg-brand-card p-4 sm:p-5 rounded-xl border border-brand-border space-y-3">
                <h4 class="font-bold text-xs text-brand-yellow uppercase tracking-wider">Entrar por Código</h4>
                <div class="flex items-center space-x-2">
                    <input type="text" id="private-code-input" maxlength="3" placeholder="000" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-28 bg-zinc-900 border border-brand-border rounded-xl px-3 py-2.5 text-base text-center font-mono font-bold text-brand-yellow focus:outline-none focus:border-brand-yellow">
                    <button onclick="joinPrivateRoomByCode()" class="px-5 py-2.5 bg-brand-yellow text-black font-extrabold rounded-xl text-xs uppercase transition-all shadow-md">
                        Entrar na Sala
                    </button>
                </div>
            </div>
        </div>
    </main>
    <!-- TELA DE JOGO -->
    <main id="game-screen" class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex-col lg:grid-cols-12 lg:grid-rows-[minmax(0,1fr)] gap-3 lg:gap-4 lg:h-[calc(100vh-75px)] overflow-y-auto lg:overflow-hidden">
        
        <!-- PAINEL ESQUERDO: JOGADORES DA SALA -->
        <div class="lg:col-span-3 bg-brand-card rounded-xl p-3 border border-brand-border flex flex-col justify-between shadow-lg h-48 lg:h-full">
            <div>
                <div class="flex items-center justify-between pb-2.5 border-b border-brand-border mb-2.5">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="users" class="w-4 h-4 text-brand-yellow"></i>
                        <span class="font-bold text-xs sm:text-sm">Jogadores</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div id="private-room-code-badge" class="hidden bg-black border border-brand-yellow px-2 py-0.5 rounded text-[10px] font-mono font-bold text-brand-yellow">
                            CÓDIGO: <span id="code-value" class="text-white">---</span>
                        </div>
                        <span id="room-player-count" class="text-xs font-mono font-bold bg-zinc-900 px-2 py-0.5 rounded text-brand-yellow border border-brand-yellow/30">1/10</span>
                    </div>
                </div>

                <div id="players-list" class="space-y-1.5 overflow-y-auto max-h-28 lg:max-h-[calc(100vh-260px)] pr-1"></div>
            </div>

            <div class="pt-2.5 border-t border-brand-border space-y-1.5">
                <button id="btn-skip-draw" onclick="skipDrawing()" class="hidden w-full py-1.5 bg-zinc-800 hover:bg-zinc-700 text-brand-yellow font-bold text-xs rounded-lg border border-brand-border flex items-center justify-center space-x-1">
                    <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
                    <span>Pular Desenho</span>
                </button>

                <button onclick="leaveRoom()" class="btn-leave w-full py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg shadow transition-all">
                    Sair da Sala
                </button>
            </div>
        </div>

        <!-- PAINEL CENTRAL: CANVAS DE DESENHO DA SALA -->
        <div id="canvas-container-box" class="lg:col-span-6 flex flex-col space-y-2.5 h-[420px] lg:h-full relative">
            <div class="bg-brand-card p-2.5 rounded-xl border border-brand-border flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="text-center">
                        <span class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold block">TEMPO</span>
                        <span id="game-timer" class="font-mono text-base sm:text-lg font-black text-brand-yellow">---</span>
                    </div>
                    <div class="h-7 w-px bg-brand-border"></div>
                    <div>
                        <span class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold block">PALAVRA</span>
                        <span id="game-word" class="font-bold text-sm sm:text-base tracking-widest text-white">_ _ _ _ _</span>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button id="btn-fs-panel" onclick="toggleFs(document.getElementById('canvas-container-box'))" title="Tela cheia no painel de desenho" class="hidden px-2.5 py-1 bg-zinc-800 text-brand-yellow font-extrabold rounded-lg border border-brand-border text-xs transition-all">⛶</button>
                    <button id="btn-free-mode" onclick="toggleFreeModeInRoom()" class="px-3 py-1 bg-brand-yellow text-black font-extrabold rounded-lg hover:bg-brand-yellowHover text-xs uppercase transition-all shadow">
                        Modo Livre
                    </button>
                    <span id="room-theme-badge" class="px-2 py-0.5 bg-brand-yellow/10 text-brand-yellow text-[11px] font-bold rounded border border-brand-yellow/30 uppercase">Alimentos</span>
                </div>
            </div>

            <div id="game-board" class="relative flex-1 min-h-0 bg-white rounded-xl overflow-hidden shadow-2xl border-2 border-brand-border flex items-center justify-center">
                <canvas id="paint-canvas" width="700" height="450" class="cursor-crosshair bg-white block flex-none"></canvas>

                <div id="waiting-players-overlay" class="hidden absolute inset-0 bg-black/90 z-30 flex flex-col items-center justify-center p-4 text-center space-y-2">
                    <i data-lucide="clock" class="w-10 h-10 text-brand-yellow animate-spin"></i>
                    <h3 class="text-sm sm:text-base font-bold text-white">Aguardando mais jogadores...</h3>
                </div>

                <div id="drawer-overlay" class="hidden absolute top-2.5 left-2.5 bg-black/80 backdrop-blur-sm text-white px-2.5 py-1 rounded border border-zinc-700 text-[11px] flex items-center space-x-1.5">
                    <i data-lucide="brush" class="w-3.5 h-3.5 text-brand-yellow"></i>
                    <span id="drawer-name" class="font-semibold">Jogador desenhando...</span>
                </div>
            </div>

            <!-- FERRAMENTAS DE DESENHO DO DESENHISTA -->
            <div id="drawing-tools" class="hidden bg-brand-card p-2 rounded-xl border border-brand-border flex-wrap items-center justify-between gap-1.5 shadow-md">
                <div class="flex items-center space-x-1">
                    <button onclick="setTool('pencil')" id="tool-pencil" class="p-1.5 rounded bg-brand-yellow text-black font-bold transition-all" title="Lápis">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="setTool('bucket')" id="tool-bucket" class="p-1.5 rounded hover:bg-zinc-800 text-zinc-300 transition-all" title="Balde">
                        <i data-lucide="paint-bucket" class="w-4 h-4"></i>
                    </button>
                    <button onclick="setTool('eraser')" id="tool-eraser" class="p-1.5 rounded hover:bg-zinc-800 text-zinc-300 transition-all" title="Borracha">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                    </button>
                    <div class="h-5 w-px bg-brand-border mx-0.5"></div>
                    <button onclick="undoLastStroke()" class="p-1.5 rounded hover:bg-zinc-800 text-zinc-300 transition-all" title="Desfazer">
                        <i data-lucide="undo" class="w-4 h-4"></i>
                    </button>
                    <button onclick="clearCanvas()" class="p-1.5 rounded hover:bg-zinc-800 text-red-400 transition-all" title="Limpar">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex items-center space-x-1.5 bg-zinc-900 px-1.5 py-0.5 rounded border border-brand-border">
                    <button onclick="setLineWidth(2)" class="w-5 h-5 rounded flex items-center justify-center hover:bg-zinc-800"><div class="w-1.5 h-1.5 bg-white rounded-full"></div></button>
                    <button onclick="setLineWidth(6)" class="w-5 h-5 rounded flex items-center justify-center hover:bg-zinc-800"><div class="w-3 h-3 bg-white rounded-full"></div></button>
                    <button onclick="setLineWidth(14)" class="w-5 h-5 rounded flex items-center justify-center hover:bg-zinc-800"><div class="w-4 h-4 bg-white rounded-full"></div></button>
                </div>

                <div id="palette" class="flex items-center space-x-1"></div>
            </div>
        </div>

        <!-- PAINEL DIREITO: CHATS (CHUTES X BATE-PAPO) -->
        <div class="lg:col-span-3 bg-brand-card rounded-xl border border-brand-border flex flex-col justify-between overflow-hidden shadow-lg h-52 lg:h-full">
            <div class="flex border-b border-brand-border bg-zinc-900/60">
                <button id="tab-guess" onclick="switchChatTab('guess')" class="flex-1 py-2 text-xs font-bold text-brand-yellow border-b-2 border-brand-yellow flex items-center justify-center space-x-1 transition-all">
                    <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                    <span>Chutes</span>
                </button>
                <button id="tab-public" onclick="switchChatTab('public')" class="flex-1 py-2 text-xs font-bold text-zinc-400 hover:text-white flex items-center justify-center space-x-1 transition-all">
                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                    <span>Bate-Papo</span>
                    <span id="chat-badge" class="hidden min-w-[16px] h-4 px-1 rounded-full bg-red-600 text-white text-[9px] font-black leading-4 text-center"></span>
                </button>
            </div>

            <div id="chat-messages-guess" class="flex-1 p-2.5 overflow-y-auto space-y-1.5 text-xs"></div>
            <div id="chat-messages-public" class="hidden flex-1 p-2.5 overflow-y-auto space-y-1.5 text-xs"></div>

            <div class="p-2 border-t border-brand-border bg-zinc-900/40">
                <form id="chat-form" onsubmit="handleChatSubmit(event)" class="space-y-1">
                    <div class="relative">
                        <input type="text" id="chat-input" maxlength="100" placeholder="Digite sua mensagem..." class="w-full bg-zinc-900 border border-brand-border rounded-lg pl-3 pr-9 py-1.5 text-xs text-white focus:outline-none focus:border-brand-yellow transition-all">
                        <button type="submit" class="absolute right-1 top-1 p-1 bg-brand-yellow text-black rounded hover:bg-brand-yellowHover transition-colors">
                            <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- MODO LIVRE (DENTRO DA SALA) -->
    <div id="free-mode-modal" class="hidden fixed inset-0 bg-[#0A0A0A] z-50 flex flex-col p-2.5 gap-2 overflow-hidden">
        <div class="flex items-center justify-between gap-2 flex-wrap">
            <h2 class="text-base sm:text-lg font-black text-brand-yellow">Modo Livre</h2>
            <div class="flex items-center gap-2">
                <button onclick="toggleFreeModeInRoom()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg border border-brand-border text-xs uppercase">Voltar ao jogo</button>
                <button onclick="leaveRoom()" class="btn-leave px-3 py-1.5 font-bold rounded-lg text-xs uppercase">Sair da Sala</button>
            </div>
        </div>
        <div id="free-stage" class="flex-1 min-h-0 flex items-center justify-center">
            <div id="free-board" class="relative bg-white rounded-xl overflow-hidden shadow-2xl border-2 border-brand-border">
                <canvas id="free-paint-canvas" width="700" height="450" class="block w-full h-full cursor-crosshair bg-white"></canvas>
                <div id="free-watchers" class="hidden absolute top-2 right-2 z-10 bg-black/80 text-white px-2.5 py-1 rounded border border-zinc-700 text-xs font-bold items-center gap-1.5 pointer-events-none"></div>
            </div>
        </div>
        <div id="free-toolbar" class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1.5 bg-brand-card p-2 rounded-xl border border-brand-border shadow-md"></div>
    </div>

    <!-- MODAL DE PERFIL (COM SUPORTE A TODOS OS FORMATOS DE IMAGEM/GIF DA GALERIA) -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-brand-card w-full max-w-sm rounded-2xl border border-brand-border p-5 shadow-2xl relative space-y-4 max-h-[92vh] overflow-y-auto">
            <button onclick="toggleProfileModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex flex-col items-center space-y-2">
                <div class="w-20 h-20 rounded-2xl border-2 border-brand-yellow overflow-hidden flex items-center justify-center shadow-lg">
                    <img id="modal-avatar-preview" src="" class="w-full h-full object-cover">
                </div>
            </div>

            <div id="preset-avatars" class="flex flex-wrap justify-center gap-3 py-1"></div>
            <input type="file" id="avatar-file" accept="image/*" class="hidden">

            <div>
                <label class="text-xs font-bold text-zinc-300 block mb-1">Nome</label>
                <input type="text" id="modal-name-input" maxlength="15" placeholder="" class="w-full bg-zinc-900 border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-yellow">
            </div>

            <div>
                <label class="text-xs font-bold text-zinc-300 block mb-1">Biografia</label>
                <input type="text" id="modal-bio-input" maxlength="50" placeholder="" class="w-full bg-zinc-900 border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-yellow">
            </div>

            <div class="sm:hidden flex justify-center gap-2 text-xs font-bold">
                <button data-lang="pt" onclick="setLanguage('pt')" class="lang-btn px-3 py-1.5 rounded-lg bg-brand-yellow text-black transition-all font-bold">PT</button>
                <button data-lang="en" onclick="setLanguage('en')" class="lang-btn px-3 py-1.5 rounded-lg text-zinc-400 transition-all font-bold">EN</button>
                <button data-lang="es" onclick="setLanguage('es')" class="lang-btn px-3 py-1.5 rounded-lg text-zinc-400 transition-all font-bold">ES</button>
            </div>

            <button onclick="saveUserProfile()" class="w-full py-2.5 bg-brand-yellow text-black font-bold rounded-xl hover:bg-brand-yellowHover transition-all text-xs uppercase tracking-wider">
                Salvar Perfil
            </button>
        </div>
    </div>

    <!-- MODAL CRIAR SALA PERSONALIZADA -->
    <div id="create-custom-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-brand-card w-full max-w-sm rounded-2xl border border-brand-border p-5 shadow-2xl relative space-y-4 max-h-[92vh] overflow-y-auto">
            <button onclick="closeCreateCustomModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 id="custom-modal-title" class="text-base sm:text-lg font-black text-brand-yellow">Criar Sala Personalizada</h3>
            <div>
                <label class="text-xs font-bold text-zinc-300 block mb-1">Nome da Sala</label>
                <input type="text" id="custom-room-name-input" maxlength="30" placeholder="" class="w-full bg-zinc-900 border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-yellow">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-300 block mb-1">Tema</label>
                <select id="custom-room-theme-select" onchange="onCustomThemeChange()" class="w-full bg-zinc-900 border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-yellow">
                    <option value="alimentos">Alimentos</option>
                    <option value="gerais">Gerais</option>
                    <option value="verbos">Verbos</option>
                    <option value="animais">Animais</option>
                    <option value="bandeiras">Bandeiras</option>
                    <option value="animes">Animes</option>
                    <option value="filmes">Filmes</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            <div>
                <label id="custom-words-label" class="text-xs font-bold text-zinc-300 block mb-1">Palavras para desenhar (opcional)</label>
                <div class="flex gap-2">
                    <input type="text" id="custom-word-input" maxlength="15" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomWord();}" class="flex-1 min-w-0 bg-zinc-900 border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-yellow">
                    <button type="button" onclick="addCustomWord()" class="px-3 bg-brand-yellow text-black font-bold rounded-lg text-xs uppercase hover:bg-brand-yellowHover">Adicionar</button>
                </div>
                <div id="custom-words-list" class="flex flex-wrap gap-1.5 mt-2 max-h-32 overflow-y-auto"></div>
            </div>
            <button id="custom-save-btn" onclick="saveCustomRoom()" class="w-full py-2.5 bg-brand-yellow text-black font-bold rounded-xl hover:bg-brand-yellowHover text-xs uppercase">
                Criar Sala
            </button>
        </div>
    </div>

            { id: 'alimentos', name: { pt: 'Alimentos', en: 'Food', es: 'Comidas' }, icon: 'utensils', words: Array.from({length: 100}, (_, i) => `COMIDA_${i+1}`) },
            { id: 'gerais', name: { pt: 'Gerais', en: 'General', es: 'Generales' }, icon: 'box', words: Array.from({length: 100}, (_, i) => `OBJETO_${i+1}`) },
            { id: 'verbos', name: { pt: 'Verbos', en: 'Verbs', es: 'Verbos' }, icon: 'activity', words: Array.from({length: 100}, (_, i) => currentLang === 'pt' ? `CORRER_${i+1}` : `RUN_${i+1}`) },
            { id: 'animais', name: { pt: 'Animais', en: 'Animals', es: 'Animales' }, icon: 'dog', words: Array.from({length: 100}, (_, i) => `ANIMAL_${i+1}`) },
            { id: 'bandeiras', name: { pt: 'Bandeiras', en: 'Flags', es: 'Banderas' }, icon: 'flag', words: Array.from({length: 100}, (_, i) => `BANDEIRA_${i+1}`) },
            { id: 'animes', name: { pt: 'Animes', en: 'Anime', es: 'Animes' }, icon: 'tv', words: Array.from({length: 200}, (_, i) => `ANIME_SERIES_${i+1}`) },
            { id: 'filmes', name: { pt: 'Filmes', en: 'Movies', es: 'Películas' }, icon: 'film', words: Array.from({length: 200}, (_, i) => `MOVIE_${i+1}`) }
        ];

        let roomsData = roomThemes.map(theme => ({
            id: theme.id,

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-pt').className = lang === 'pt' ? 'px-2.5 py-1 rounded-lg bg-brand-yellow text-black transition-all font-bold' : 'px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-2.5 py-1 rounded-lg bg-brand-yellow text-black transition-all font-bold' : 'px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all';
            renderRooms();
            if (activeRoom) {
                document.getElementById('room-theme-badge').textContent = activeRoom.theme.name[currentLang];
            }

        function initOnlinePeer(customId = null) {
            try {
                if (peer) peer.destroy();
                peer = customId ? new Peer(customId) : new Peer();
                peer.on('connection', (conn) => {
                    peerConnections.push(conn);
                    conn.on('data', (data) => handleIncomingData(data));
                    conn.on('close', () => { peerConnections = peerConnections.filter(c => c !== conn); });
                });
            } catch(e) {}
        }

        function broadcastOnlineData(data) {
            peerConnections.forEach(conn => { if (conn.open) conn.send(data); });
        }

        function handleIncomingData(data) {
            if (!data) return;
            if (data.type === 'SYNC_ROOM_STATE' && activeRoom && data.roomId === activeRoom.id) {
                activeRoom.players = data.players || [];
                activeRoom.currentWord = data.currentWord || '';
                activeRoom.drawerId = data.drawerId || '';
                checkMultiplayerState();
            } else if (data.type === 'CANVAS_DRAW' && activeRoom && data.roomId === activeRoom.id) {
                drawRemoteLine(data.x0, data.y0, data.x1, data.y1, data.color, data.lineWidth, data.isEraser);
            } else if (data.type === 'CANVAS_CLEAR' && activeRoom && data.roomId === activeRoom.id) {
                clearCanvasLocal();
            }
        }

        function switchLobbyTab(tab) {
            document.getElementById('section-public-rooms').classList.add('hidden');
            document.getElementById('section-custom-rooms').classList.add('hidden');

            document.getElementById('tab-custom-btn').className = 'pb-2 font-bold text-sm text-zinc-400 hover:text-white uppercase tracking-wider transition-all whitespace-nowrap';

                    <div class="flex items-center space-x-3">

                            <i data-lucide="${room.theme.icon}" class="w-5 h-5 sm:w-6 sm:h-6"></i>

                        <span class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-zinc-900 text-brand-yellow border border-brand-yellow/30">

                        <button onclick="enterRoom('${room.id}')" ${isFull ? 'disabled' : ''} class="px-4 sm:px-5 py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition-all ${isFull ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed' : 'bg-brand-yellow text-black hover:bg-brand-yellowHover shadow-md'}">

        function enterRoom(roomId) {
            activeRoom = roomsData.find(r => r.id === roomId);

        function joinPrivateRoomByCode() {

        function openCreateCustomModal() { customEditId = null; setCustomModalMode(); resetCustomForm(); document.getElementById('create-custom-modal').classList.remove('hidden'); }
        function closeCreateCustomModal() { document.getElementById('create-custom-modal').classList.add('hidden'); }

        function setupPlayerJoin(room) {
            const playerToJoin = { ...currentUser, score: 0 };
            if (!room.players) room.players = [];
            if (!room.players.some(p => p.id === playerToJoin.id)) {
                room.players.push(playerToJoin);
            }

            broadcastOnlineData({
                type: 'SYNC_ROOM_STATE',
                roomId: room.id,
                players: room.players,
                currentWord: room.currentWord,
                drawerId: room.drawerId
            });

            const lobby = document.getElementById('lobby-screen');
            const game = document.getElementById('game-screen');

            if (lobby) { lobby.classList.add('hidden'); lobby.style.display = 'none'; }
            if (game) { game.classList.remove('hidden'); game.style.display = 'grid'; }

            document.getElementById('room-theme-badge').textContent = room.theme.name[currentLang];

            checkMultiplayerState();
            renderPlayersList();

        function checkMultiplayerState() {
            if (!activeRoom) return;
            const waitingOverlay = document.getElementById('waiting-players-overlay');
            const drawerOverlay = document.getElementById('drawer-overlay');

            if (activeRoom.players.length < 2) {
                if (waitingOverlay) waitingOverlay.classList.remove('hidden');
                if (drawerOverlay) drawerOverlay.classList.add('hidden');

                const tools = document.getElementById('drawing-tools');
                if (tools) { tools.classList.add('hidden'); tools.classList.remove('flex'); }

                clearInterval(gameTimerInterval);
                document.getElementById('game-timer').textContent = "---";
                document.getElementById('game-word').textContent = "_ _ _ _ _";
            } else {
                if (waitingOverlay) waitingOverlay.classList.add('hidden');
                if (drawerOverlay) drawerOverlay.classList.remove('hidden');

                if (!gameTimerInterval && (!activeRoom.drawerId || activeRoom.drawerId === '')) {
                    resetRound();
                }
            }
            renderPlayersList();
        }

        function leaveRoom() {
            if (activeRoom && activeRoom.players) {
                activeRoom.players = activeRoom.players.filter(p => p.id !== currentUser.id);
                broadcastOnlineData({
                    type: 'SYNC_ROOM_STATE',
                    roomId: activeRoom.id,
                    players: activeRoom.players,
                    currentWord: activeRoom.currentWord,
                    drawerId: activeRoom.drawerId
                });
            }
            activeRoom = null;
            clearInterval(gameTimerInterval);

            const lobby = document.getElementById('lobby-screen');
            const game = document.getElementById('game-screen');

            if (game) { game.classList.add('hidden'); game.style.display = 'none'; }
            if (lobby) { lobby.classList.remove('hidden'); lobby.style.display = 'block'; }

            renderRooms();
        }

        function showLobby() { if (activeRoom) leaveRoom(); }

        let gameTimerInterval = null;
        let timeLeft = 60;
        let drawerIndex = 0;

        function resetRound() {
            if (!activeRoom || !activeRoom.players || activeRoom.players.length < 2 || isTransitioning) return;
            isTransitioning = true;

            const words = activeRoom.theme.words;
            activeRoom.currentWord = words[Math.floor(Math.random() * words.length)];
            activeRoom.guessedPlayers = [];

            drawerIndex = (drawerIndex + 1) % activeRoom.players.length;
            const currentDrawer = activeRoom.players[drawerIndex];
            activeRoom.drawerId = currentDrawer ? currentDrawer.id : currentUser.id;

            clearCanvasLocal();
            updateRoundUI();
            startTimer();

            setTimeout(() => { isTransitioning = false; }, 1000);
        }

        function updateRoundUI() {
            if (!activeRoom) return;
            const currentDrawer = activeRoom.players.find(p => p.id === activeRoom.drawerId) || activeRoom.players[0];
            const isMeDrawer = currentDrawer && currentDrawer.id === currentUser.id;

            document.getElementById('drawer-name').textContent = isMeDrawer ? "Você está desenhando!" : `${currentDrawer && currentDrawer.name ? currentDrawer.name : 'Jogador'} desenhando...`;
            document.getElementById('game-word').textContent = isMeDrawer ? activeRoom.currentWord : activeRoom.currentWord.replace(/[A-Z]/g, '_ ');

            const tools = document.getElementById('drawing-tools');
            if (tools) {
                if (isMeDrawer) { tools.classList.remove('hidden'); tools.classList.add('flex'); }
                else { tools.classList.add('hidden'); tools.classList.remove('flex'); }
            }
            renderPlayersList();
        }

        function startTimer() {
            clearInterval(gameTimerInterval);
            timeLeft = 60;
            document.getElementById('game-timer').textContent = `${timeLeft}s`;

            gameTimerInterval = setInterval(() => {
                if (!activeRoom || !activeRoom.players || activeRoom.players.length < 2) {
                    clearInterval(gameTimerInterval);
                    return;
                }
                timeLeft--;
                document.getElementById('game-timer').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    showTransition("Tempo Esgotado!", 1500, () => resetRound());
                }
            }, 1000);
        }

        function showTransition(text, duration, callback) {
            clearInterval(gameTimerInterval);
            const overlay = document.getElementById('transition-overlay');
            document.getElementById('transition-title').textContent = text;
            document.getElementById('transition-subtitle').textContent = `Palavra era: ${activeRoom ? activeRoom.currentWord : ''}`;
            overlay.classList.remove('hidden');

            setTimeout(() => {
                overlay.classList.add('hidden');
                if (callback) callback();
            }, duration);
        }

        function skipDrawing() {
            if (!activeRoom || isTransitioning) return;
            showTransition("Desenho Pulado!", 1500, () => resetRound());
        }

        const escHtml = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        function winBadge(n) {
            n = n || 0;
            if (n <= 0) return '';
            return n >= 10 ? '<span class="win-badge win-inf">∞</span>' : `<span class="win-badge">★${n}</span>`;
        }

        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let isDrawing = false;
        let currentColor = '#000000';
        let currentLineWidth = 4;
        let currentTool = 'pencil';
        let strokeHistory = [];

        function initCanvas() {
            if (!ctx) return;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveCanvasState();
            setupPalette();
        }

        function saveCanvasState() {
            if (!ctx) return;
            strokeHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (strokeHistory.length > 25) strokeHistory.shift();
        }

        function undoLastStroke() {
            if (!ctx) return;
            if (strokeHistory.length > 1) {
                strokeHistory.pop();
                ctx.putImageData(strokeHistory[strokeHistory.length - 1], 0, 0);
            }
        }

        function clearCanvasLocal() {
            if (!ctx) return;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveCanvasState();
        }

        function clearCanvas() {
            clearCanvasLocal();
            if (activeRoom) broadcastOnlineData({ type: 'CANVAS_CLEAR', roomId: activeRoom.id });
        }

        let lastX = 0, lastY = 0;

        if (canvas) {
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            const startDraw = (e) => {
                if (!activeRoom || activeRoom.players.length < 2 || activeRoom.drawerId !== currentUser.id) return;
                const pos = getPos(e);
                lastX = pos.x; lastY = pos.y;

                if (currentTool === 'bucket') {
                    floodFill(Math.floor(lastX), Math.floor(lastY), hexToRgb(currentColor));
                    saveCanvasState();
                    return;
                }
                isDrawing = true;
            };

            const moveDraw = (e) => {
                if (!isDrawing || !activeRoom || activeRoom.drawerId !== currentUser.id) return;
                if (e.type === 'mousemove' && e.buttons === 0) { stopDraw(); return; }
                const pos = getPos(e);
                drawLineLocal(lastX, lastY, pos.x, pos.y, currentColor, currentLineWidth, currentTool === 'eraser');
                
                broadcastOnlineData({
                    type: 'CANVAS_DRAW',
                    roomId: activeRoom.id,
                    x0: lastX, y0: lastY, x1: pos.x, y1: pos.y,
                    color: currentColor,
                    lineWidth: currentLineWidth,
                    isEraser: currentTool === 'eraser'
                });
                lastX = pos.x; lastY = pos.y;
            };

            const stopDraw = () => { if (isDrawing) { isDrawing = false; saveCanvasState(); } };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', moveDraw);
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
            canvas.addEventListener('mouseenter', e => {
                if (!isDrawing) return;
                if (e.buttons & 1) { const p = getPos(e); lastX = p.x; lastY = p.y; } else stopDraw();
            });
            ['mouseup', 'touchend', 'touchcancel', 'pointerup', 'pointercancel', 'blur'].forEach(n => window.addEventListener(n, stopDraw));
        }

        function drawLineLocal(x0, y0, x1, y1, color, width, isEraser) {
            if (!ctx) return;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = isEraser ? '#FFFFFF' : color;
            ctx.lineWidth = isEraser ? width * 3 : width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawRemoteLine(x0, y0, x1, y1, color, width, isEraser) {
            drawLineLocal(x0, y0, x1, y1, color, width, isEraser);
        }

        function floodFill(startX, startY, fillColor) {
            if (!ctx) return;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const targetColor = getPixelColor(data, startX, startY);
            if (colorsMatch(targetColor, fillColor)) return;

            const pixelStack = [[startX, startY]];
            const width = canvas.width, height = canvas.height;

            while (pixelStack.length) {
                const [x, y] = pixelStack.pop();
                let currentY = y;
                while (currentY >= 0 && colorsMatch(getPixelColor(data, x, currentY), targetColor)) currentY--;
                currentY++;

                let reachLeft = false, reachRight = false;
                while (currentY < height && colorsMatch(getPixelColor(data, x, currentY), targetColor)) {
                    setPixelColor(data, x, currentY, fillColor);
                    if (x > 0) {
                        if (colorsMatch(getPixelColor(data, x - 1, currentY), targetColor)) {
                            if (!reachLeft) { pixelStack.push([x - 1, currentY]); reachLeft = true; }
                        } else if (reachLeft) { reachLeft = false; }
                    }
                    if (x < width - 1) {
                        if (colorsMatch(getPixelColor(data, x + 1, currentY), targetColor)) {
                            if (!reachRight) { pixelStack.push([x + 1, currentY]); reachRight = true; }
                        } else if (reachRight) { reachRight = false; }
                    }
                    currentY++;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function getPixelColor(data, x, y) {
            const index = (y * canvas.width + x) * 4;
            return [data[index], data[index + 1], data[index + 2], data[index + 3]];
        }
        function setPixelColor(data, x, y, color) {
            const index = (y * canvas.width + x) * 4;
            data[index] = color[0]; data[index + 1] = color[1]; data[index + 2] = color[2]; data[index + 3] = 255;
        }
        function colorsMatch(c1, c2) { return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2]; }
        function hexToRgb(hex) {
            const bigint = parseInt(hex.replace('#', ''), 16);
            return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
        }

        const colors = ['#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#8B4513'];

        function setupPalette() {
            const container = document.getElementById('palette');
            if (!container) return;
            container.innerHTML = '';
            colors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'w-4 h-4 sm:w-5 sm:h-5 rounded-full border border-zinc-700 transition-transform hover:scale-110';
                btn.style.backgroundColor = color;
                btn.onclick = () => { currentColor = color; if (currentTool === 'eraser') currentTool = 'pencil'; };
                container.appendChild(btn);
            });
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#drawing-tools button').forEach(b => b.classList.remove('bg-brand-yellow', 'text-black'));
            document.getElementById(`tool-${tool}`)?.classList.add('bg-brand-yellow', 'text-black');
        }

        function setLineWidth(w) { currentLineWidth = w; }

        let activeChatTab = 'guess';
        let chatUnread = 0;
        function renderChatBadge() {
            const b = document.getElementById('chat-badge'); if (!b) return;
            b.textContent = chatUnread > 9 ? '+9' : String(chatUnread);
            b.classList.toggle('hidden', chatUnread <= 0);
        }
        function switchChatTab(tab) {
            activeChatTab = tab;
            if (tab === 'public') { chatUnread = 0; renderChatBadge(); }
            const guessBtn = document.getElementById('tab-guess');
            const publicBtn = document.getElementById('tab-public');
            const guessBox = document.getElementById('chat-messages-guess');
            const publicBox = document.getElementById('chat-messages-public');

            if (tab === 'guess') {
                if (guessBtn) guessBtn.className = 'flex-1 py-2 text-xs font-bold text-brand-yellow border-b-2 border-brand-yellow flex items-center justify-center space-x-1 transition-all';
                if (publicBtn) publicBtn.className = 'flex-1 py-2 text-xs font-bold text-zinc-400 hover:text-white flex items-center justify-center space-x-1 transition-all';
                if (guessBox) guessBox.classList.remove('hidden');
                if (publicBox) publicBox.classList.add('hidden');
            } else {
                if (publicBtn) publicBtn.className = 'flex-1 py-2 text-xs font-bold text-brand-yellow border-b-2 border-brand-yellow flex items-center justify-center space-x-1 transition-all';
                if (guessBtn) guessBtn.className = 'flex-1 py-2 text-xs font-bold text-zinc-400 hover:text-white flex items-center justify-center space-x-1 transition-all';
                if (publicBox) publicBox.classList.remove('hidden');
                if (guessBox) guessBox.classList.add('hidden');
            }
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const pName = currentUser.name && currentUser.name.trim() !== '' ? currentUser.name : 'Anônimo';

            if (activeChatTab === 'guess') {
                if (!activeRoom || activeRoom.players.length < 2) {
                    showAlertBanner("Aguarde a partida começar para enviar chutes!");
                    return;
                }

                if (text.toUpperCase() === activeRoom.currentWord.toUpperCase()) {
                    if (!activeRoom.guessedPlayers.includes(currentUser.id)) {
                        activeRoom.guessedPlayers.push(currentUser.id);
                        const pointsEarned = Math.max(1, 11 - activeRoom.guessedPlayers.length);
                        currentUser.score += pointsEarned;

                        addChatMessage('guess', `${pName}: ${text}`);
                        addChatMessage('system', `${pName} acertou a palavra! (+${pointsEarned} pts)`);

                        renderPlayersList();
                        checkAllGuessedOrPoints();

        }

        let customWords = [], customEditId = null;
        function cleanWord(w) { return String(w || '').trim().slice(0, 15).trim().toUpperCase(); }
        function renderCustomWords() {
            const box = document.getElementById('custom-words-list'); if (!box) return;
            box.innerHTML = '';
            customWords.forEach((w, i) => {
                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-1 bg-zinc-900 border border-brand-border rounded-full pl-2.5 pr-1 py-0.5 text-[11px] font-bold text-white';
                chip.appendChild(document.createTextNode(w));
                const x = document.createElement('button');
                x.type = 'button'; x.textContent = '✕';
                x.onclick = () => { customWords.splice(i, 1); renderCustomWords(); };
                chip.appendChild(x); box.appendChild(chip);
            });
        }
        function addCustomWord() {
            const inp = document.getElementById('custom-word-input'); if (!inp) return;
            const w = cleanWord(inp.value);
            if (!w) return;
            if (!customWords.includes(w) && customWords.length < 300) customWords.push(w);
            inp.value = ''; renderCustomWords();
        }
        function resetCustomForm() {
            customWords = []; renderCustomWords();
            document.getElementById('custom-room-name-input').value = '';
            document.getElementById('custom-word-input').value = '';
            document.getElementById('custom-room-theme-select').value = 'alimentos';
        }
        function setCustomModalMode() {
            document.getElementById('custom-modal-title').textContent = tr(customEditId ? 'Editar Sala Personalizada' : 'Criar Sala Personalizada');
            document.getElementById('custom-save-btn').textContent = tr(customEditId ? 'Salvar Alterações' : 'Criar Sala');
        }
        function onCustomThemeChange() {}

        const TAB_ID = 't' + Math.random().toString(36).slice(2);
        const LOCK_KEY = 'artrok_lock';
        let joinPendingUntil = 0;

        const _sendWSBase = sendWS;
        sendWS = function (o) { return _sendWSBase(o); };
        const _onServerBase = onServer;
        onServer = function (m) { _onServerBase(m); };

        function toggleFullscreenApp() {
            if (document.fullscreenElement) { document.exitFullscreen(); return; }
            document.documentElement.requestFullscreen().catch(() => {});
        }
        function toggleFs(el) { el.classList.toggle('pseudo-fs'); }
        function exitFsAll() { document.querySelectorAll('.pseudo-fs').forEach(e => e.classList.remove('pseudo-fs')); }
        function fitGameCanvas() {}

        refreshRoomUI = function () {
            if (!activeRoom) return;
            const a = activeRoom, meDrawer = a.drawerId === currentUser.id, playing = a.phase === 'drawing';
            document.getElementById('btn-skip-draw').classList.toggle('hidden', !drawing);
            renderPlayersList();
        };

        const I18N_D = {};
        const LANGS = ['pt', 'en', 'es'];
        function tr(s) { return s; }
        function trf(s, v) { return s; }
        function trServer(s) { return s; }
        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function safeImg(s) { return typeof s === 'string' && s.length < 7200000 && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s); }

        function applyStaticI18n() {}
        function navNameText() { return currentUser.name && currentUser.name.trim() !== '' ? currentUser.name : 'Perfil'; }

        // =====================================================================
        // FUNÇÃO DE UPLOAD ROBUSTA: ACEITA QUALQUER FORMATO DE IMAGEM / GIF E VALIDA 5MB
        // =====================================================================
        function handleAvatarFile(file) {
            if (!file) return;

            // Bloqueia se for vídeo
            if (file.type.startsWith('video/')) {
                showAlertBanner('Por favor, envie apenas arquivos de imagem!');
                return;
            }

            // Validação de limite de 5 MB
            if (file.size > 5 * 1024 * 1024) {
                showAlertBanner('A imagem é muito grande! O limite máximo é de 5 MB.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.avatar = e.target.result;
                updateAvatarImages();
                persistProfile();
                sendProfile();
            };
            reader.readAsDataURL(file);
        }

        const _setupPresetBase = setupPresetAvatars;
        setupPresetAvatars = function () {
            _setupPresetBase();
            const c = document.getElementById('preset-avatars'); if (!c) return;
            const tile = document.createElement('button');
            tile.type = 'button'; tile.title = 'Escolher da galeria';
            tile.className = 'w-14 h-14 rounded-xl border-2 border-dashed border-zinc-600 hover:border-brand-yellow text-brand-yellow flex items-center justify-center flex-shrink-0 transition-transform hover:scale-105';
            tile.innerHTML = '<i data-lucide="image-plus" class="w-6 h-6"></i>';
            tile.onclick = () => document.getElementById('avatar-file').click();
            c.appendChild(tile); lucide.createIcons();
        };
        document.getElementById('avatar-file').onchange = e => { handleAvatarFile(e.target.files[0]); e.target.value = ''; };

        function profileSnapshot() {
            const i = presetAvatarsList.indexOf(currentUser.avatar);
            return { name: currentUser.name, bio: currentUser.bio, av: i >= 0 ? i : null, img: i < 0 ? currentUser.avatar : null };
        }
        function applyProfile(pr) {
            if (!pr) return;
            if (typeof pr.name === 'string') currentUser.name = pr.name.slice(0, 15);
            if (typeof pr.bio === 'string') currentUser.bio = pr.bio.slice(0, 50);
            if (safeImg(pr.img)) currentUser.avatar = pr.img;
            updateAvatarImages();
        }
        function persistProfile() {
            try { localStorage.setItem('artrok_profile', JSON.stringify(profileSnapshot())); } catch (e) {}
        }

        try { applyProfile(JSON.parse(localStorage.getItem('artrok_profile') || 'null')); } catch (e) {}

        function toggleFreeModeInRoom() {
            const modal = document.getElementById('free-mode-modal');
            modal.classList.toggle('hidden');
        }

        setGoogleButton();
        connectServer();
    </script>
</body>
</html>
